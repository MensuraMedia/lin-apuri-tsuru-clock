[package]
name = "linclock"
description = "lin-apuri-tsūru-clock: a native Japanese learning clock (egui/eframe). 24-hour display with Japanese readings and spoken time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "linclock"
path = "src/main.rs"

[features]
default = ["gui", "audio"]
gui = ["dep:eframe", "dep:egui_extras", "dep:resvg", "dep:image"]  # egui/eframe/wgpu window + SVG icons + bg images
audio = ["dep:ureq", "dep:serde_json"]  # live VOICEVOX speaker + OS audio player

[dependencies]
jptime = { path = "../jptime" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
egui_extras = { version = "0.31", optional = true, default-features = false, features = ["svg"] }
resvg = { version = "0.44", optional = true, default-features = false }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp"] }
ureq = { version = "2", optional = true, default-features = false, features = ["json"] }
serde_json = { version = "1", optional = true }
eframe = { version = "0.31", optional = true, default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
